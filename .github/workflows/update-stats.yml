name: Update README stats
on:
  schedule:
    - cron: "0 3 * * *"   # roda 1x por dia às 03:00 UTC
  workflow_dispatch:        # permite rodar manualmente pela aba Actions
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Gerar card de estatísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=dark&count_private=true&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}
      - name: Gerar card de linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=dark&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}
      - name: Commitar os cards atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Atualiza estatísticas do README" || exit 0
          git push
