
name: Update README stats

on:
  schedule:
    - cron: "0 3 * * *" # Todos os dias às 03:00 UTC (00:00 em Fortaleza)
  workflow_dispatch: # Permite executar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Gerar card de estatísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=dark&count_private=true&hide_border=true&ring_color=ff3b30
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Gerar card de linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=dark&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Salvar cards atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if ! git diff --cached --quiet; then
            git commit -m "chore: atualiza estatísticas do GitHub"
            git push
          else
            echo "Nenhuma alteração nos cards."
          fi
